<link rel="stylesheet" href="{{ url_for('static', filename='css/base/wizard.css') }}">

<section class="center w-full h-screen wizard-container" id="newExpenseWizard">
    <form action="/expenses/new" method="post" class="form column gap-20 p-20 rounded-16">
        <span class="link symbol" id="closeWizard">close</span>

        <div class="heading column">
            <h1 class="h1">New expense</h1>
            <p class="para">Add expense details below and click 'note'.</p>
        </div>

        <div class="input-list column gap-12">
            <div class="form-elem column gap-4">
                <label for="title">Title*</label>
                <input required type="text" name="title" id="title" class="input" placeholder="Server bills">
            </div>
            
            <div class="form-elem column gap-4">
                <label for="amount">Amount*</label>
                <input required type="number" name="amount" id="amount" class="input" placeholder="5000">
            </div>

            <div class="form-elem column gap-4">
                <label for="category">Category*</label>
                <input required type="text" name="category" id="category" class="input" placeholder="server renewals">
            </div>

            <div class="form-elem column gap-4">
                <label for="paid_on">Paid on*</label>
                <input required type="date" name="paid_on" id="paid_on" class="input">
            </div>

            <div class="form-elem column gap-4">
                <label for="desc">notes</label>
                <textarea name="desc" id="desc" class="input" placeholder="Expense notes (optional)"></textarea>
            </div>
        </div>

        <button type="submit" class="btn fl p-12 rounded-16">
            <span class="mini uppercase">update record</span>
        </button>
    </form>
</section>

<script type="module" src="{{ url_for('static', filename='js/base/wizard.js') }}"></script>
